# =============================================================================
# 菜单样式（CDE / Motif）— 标题栏窗口菜单
# 图标：Nerd Font 字形（不依赖 PNG）
# =============================================================================

MenuStyle * Mwm, BorderWidth 2
MenuStyle * MenuColorset 5, ActiveColorset 6, GreyedColorset 7, TitleColorset 8
MenuStyle * HilightBack, HilightTitleBack, ActiveFore
MenuStyle * Hilight3DThin, SeparatorsLong, TrianglesSolid, TrianglesUseFore
MenuStyle * TitleUnderlines1, !Animation
MenuStyle * VerticalItemSpacing 3 3, VerticalTitleSpacing 2 2
MenuStyle * ItemFormat "%| %l%8p%r %|"
MenuStyle * Font "xft:JetBrainsMono Nerd Font:size=10:antialias=true"
MenuStyle * TitleFont "xft:JetBrainsMono Nerd Font:size=10:antialias=true"

DestroyMenu MenuFvwmRoot
