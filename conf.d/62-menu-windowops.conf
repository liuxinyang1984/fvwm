# =============================================================================
# 窗口操作菜单（标题栏左侧按钮）
# 前缀为 Nerd Font / Font Awesome 字形
# =============================================================================

DestroyMenu MenuWindowOps
AddToMenu MenuWindowOps
+ "  Move	$[modkey_name]+Shift+m"     Move
+ "  Size	$[modkey_name]+Shift+s"     Resize
+ "  Maximize	$[modkey_name]+m"       Maximize
+ "  Minimize	$[modkey_name]+i"       Iconify
+ "" Nop
+ "  Close	$[modkey_name]+q"         Close
