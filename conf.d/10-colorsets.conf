# CDE 窗口色（参考 FVWM Wiki CDE Decor / 常见 dtwm 青绿灰绿）
# 调色板逻辑与正版 CDE 一致：
#   激活窗框、非激活窗框、工作区背景 是三套不同颜色（palette 第 1/2/3 项）
# Wiki 12 位色约合：非激活 #afc07a（偏亮橄榄）、激活偏深青
# 非激活按观感再压暗；激活保持深青绿；背景与激活拉开对比
#
# 1 - 非激活标题/按钮
# 2 - 激活标题/按钮
# 3 - 非激活边框
# 4 - 激活边框

Colorset 1 fg black, bg #738373, Plain
Colorset 2 fg white, bg #007070, Plain
Colorset 3 fg black, bg #738373, Plain
Colorset 4 fg white, bg #007070, Plain

# 菜单（先测 CDE 对话框灰，与窗框色分开）
# 5 - 普通项    6 - 选中项    7 - 灰显    8 - 标题
Colorset 5 fg black,  bg #b8b4a8, hi #d4d0c4, sh #6e6a60, Plain
Colorset 6 fg white,  bg #007070, hi #40a0a0, sh #004040, Plain
Colorset 7 fg #6e6a60, bg #b8b4a8, Plain
Colorset 8 fg white,  bg #007070, hi #40a0a0, sh #004040, Plain
