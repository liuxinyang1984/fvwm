# 最小化图标 — 参数对齐 ZoomTen/fvwm2-sgi `.fvwm/components/icons.fvwm2rc`
# 素材仍用本仓 icons/default.png（不引入其 IRIX 截图）
# IconBox 几何与 sgi 一致；分辨率不对时在 ~/.config/fvwm/local.conf 覆盖 Style * IconBox …

IconFont "-*-helvetica-medium-r-*-*-14-*-*-*-*-*-*-*"

# icon box（sgi 原文；XXX: 可按屏幕改）
Style * IconBox 1680x305+135+6, IconGrid 1 1, IconFill Left Top
Style * IconSize 90 70 -1 -1
Style * IconBackgroundRelief 2
Style * IconBackgroundPadding 2

ImagePath $[fvwm_home]/icons:+

# sgi: Style "*" Icon iconbox/generic.png
Style "*" Icon default.png

# 下列 Class 与 sgi 相同；图标一律落到 default.png（无 per-app 素材）
Style "FvwmPager" IconOverride, Icon default.png
Style "Xfce4-terminal" IconOverride, Icon default.png
Style "qterminal" IconOverride, Icon default.png
Style "*rxvt" IconOverride, Icon default.png
Style "st" IconOverride, Icon default.png
Style "St" IconOverride, Icon default.png
Style "XTerm" IconOverride, Icon default.png
Style "Alacritty" IconOverride, Icon default.png
Style "Nvidia-settings" IconOverride, Icon default.png
Style "XOsview" IconOverride, Icon default.png
Style "Blender" IconOverride, Icon default.png
Style "xfontsel" IconOverride, Icon default.png
Style "Audacious" IconOverride, Icon default.png
Style "Pavucontrol" IconOverride, Icon default.png
Style "Galculator" IconOverride, Icon default.png
Style "*NEdit" IconOverride, Icon default.png
Style "Thunar" IconOverride, Icon default.png
