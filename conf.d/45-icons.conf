# 最小化图标规则（对齐 ZoomTen/fvwm2-sgi 的 icons.fvwm2rc 行为）
# 素材：本仓 icons/default.png（非 SGI 截图像素图）
#
# SGI 原版 IconBox 为 1680x305+135+6（大图标带）；此处用视口宽 ×120 贴底，
# 小屏/嵌套 Xephyr 更稳。要原尺寸可改回：
#   Style * IconBox 1680x305+135+6, IconGrid 1 1, IconFill Left Top

IconFont "xft:sans-serif:medium:size=10:antialias=true"

ImagePath $[fvwm_home]/icons:+

# icon box：大图标区 + 左上填充（与 sgi 相同 IconGrid/IconFill）
Style * IconBox $[vp.width]x120+0-0, IconGrid 1 1, IconFill Left Top
Style * IconSize 90 70 -1 -1
Style * IconBackgroundRelief 2
Style * IconBackgroundPadding 2

# 默认图；终端类显式 IconOverride（sgi 对 st 等同理，只是他们用 term.png）
Style "*" Icon default.png
Style "st" IconOverride, Icon default.png
Style "St" IconOverride, Icon default.png
Style "*rxvt" IconOverride, Icon default.png
Style "XTerm" IconOverride, Icon default.png
Style "Alacritty" IconOverride, Icon default.png
