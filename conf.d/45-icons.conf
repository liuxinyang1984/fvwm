# 最小化 / 图标盒：共用一张默认图（规则参考 fvwm2-sgi，素材自备）
# 图标目录：$[fvwm_home]/icons/default.png

ImagePath $[fvwm_home]/icons:+

Style * IconBox 400x100-8-8, IconGrid 1 1, IconFill Left Top
Style * IconSize 48 48 -1 -1
Style * IconBackgroundRelief 2
Style * IconBackgroundPadding 2

# 全局默认；个别应用可再 Style "Class" IconOverride, Icon other.png
Style "*" Icon default.png
