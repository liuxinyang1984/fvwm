# fvwm3 MWM layout: [1 Title 642]
# Right side (inside → out): minimize | maximize | close
# 按钮 1（最左侧）: 窗口操作菜单
Mouse 1 1 A Menu MenuWindowOps
Mouse 1 6 A Iconify
Mouse 1 4 A Maximize
Mouse 1 2 A Close

# 标题栏左键：单击聚焦；拖动移动；双击卷帘
Mouse 1 T A Function MoveOrRaiseOrShade
Mouse 1 SF A Resize

# 根窗口：取消左右键默认菜单（内置 MenuFvwmRoot 等）
Mouse 1 R A Nop
Mouse 2 R A Nop
Mouse 3 R A Nop

# 最小化图标：单击还原，并重排 IconBox（对齐 fvwm2-sgi TileIcons）
DestroyFunc TileIcons
AddToFunc TileIcons
+ C Iconify off
+ C All (CurrentPage, Iconic) PlaceAgain Icon

Mouse 1 I A TileIcons
Mouse 3 I A RaiseLower

DestroyFunc MoveOrRaiseOrShade
AddToFunc MoveOrRaiseOrShade
+ I Raise
+ M Move
+ D WindowShade
