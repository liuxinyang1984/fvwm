# fvwm3 MWM layout: [1 Title 642]
# Right side (inside → out): minimize | maximize | close
Mouse 1 1 A Menu MenuWindowOps
Mouse 1 6 A Iconify
Mouse 1 4 A Maximize
Mouse 1 2 A Close

# Iconified window on desktop: click to restore
Mouse 1 I A Iconify off
Mouse 2 I A Iconify off

# Window interactions
Mouse 1 T A Function MoveOrRaise
Mouse 1 SF A Resize

# Root window: open another xterm for testing
Mouse 1 R A Exec exec xterm
Mouse 3 R A WindowList

DestroyFunc MoveOrRaise
AddToFunc MoveOrRaise
+ I Raise
+ M Move
