# =============================================================================
# 键盘快捷键绑定 (Key Bindings)
# -----------------------------------------------------------------------------
# 语法: Key <按键> <上下文> <修饰键> <动作>
#
# 上下文 (Context) 常用值:
#   A  - Anywhere，任意位置都生效（桌面、窗口、标题栏等）
#   W  - 应用程序客户区
#   T  - 标题栏
#   R  - 根窗口（桌面背景）
#
# 修饰键 (Modifiers):
#   A  - Any，任意修饰键组合（含无修饰键）
#   N  - None，必须无修饰键
#   C  - Control
#   S  - Shift
#   M  - Meta / Alt
#   4  - Super / Win 键（对应 X11 Mod4）
#   可组合，例如 "CS" 表示 Ctrl+Shift
#
# Xephyr 测试阶段用 Ctrl，避免与宿主机 Super 快捷键冲突。
# 正式会话若改回 Super，把下面修饰键 C 换成 4 即可。
#
# 说明: Maximize 在 fvwm 中为切换命令——最大化后再按一次会恢复原尺寸。
# =============================================================================

# -----------------------------------------------------------------------------
# Ctrl + Return → 启动终端
# 与 sxhkd 习惯一致，使用 alacritty；若未安装可改成 uxterm / xterm。
# -----------------------------------------------------------------------------
Key Return A C Exec exec alacritty

# -----------------------------------------------------------------------------
# Ctrl + Space → 启动 rofi 应用启动器
# 参数沿用现有 sxhkd 配置：显示桌面应用、图标与主题。
# -----------------------------------------------------------------------------
Key Space A C Exec exec rofi -show drun -show-icons -icon-theme 'Flat-Remix-Green-Light' -theme rounded-nord-dark

# -----------------------------------------------------------------------------
# Ctrl + m → 切换当前窗口最大化 / 恢复
# -----------------------------------------------------------------------------
Key m A C Maximize
