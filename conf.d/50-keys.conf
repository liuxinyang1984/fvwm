# =============================================================================
# 键盘快捷键绑定 (Key Bindings)
# -----------------------------------------------------------------------------
# 语法: Key <按键> <上下文> <修饰键> <动作>
#
# 主修饰键（只改这里；菜单文案用 $[modkey_name]）：
#   modkey      = C(Ctrl) / M(Alt·Meta) / 4(Super·Win)
#   modkey_name = Ctrl / Alt / Super（仅显示，不参与按键）
# 注意：Key 行里的 A 是「任意位置」，不是 Alt！Alt 修饰符是 M。
# 组合 Shift 写成 $[modkey]S，例如 CS、4S。
# Xephyr 测试用 C；正式桌面可改 4。
#
# 上下文: A=Anywhere  W=客户区  T=标题栏  R=根窗口
# 修饰键: C=Control  S=Shift  M=Meta/Alt  4=Super/Win  N=无  A=任意
# =============================================================================

SetEnv modkey      M
SetEnv modkey_name Alt

# -----------------------------------------------------------------------------
# modkey + Return → 终端
# -----------------------------------------------------------------------------
Key Return A $[modkey] Exec exec alacritty

# -----------------------------------------------------------------------------
# modkey + Space → rofi
# -----------------------------------------------------------------------------
DestroyFunc LaunchRofi
AddToFunc LaunchRofi
+ I Exec exec rofi -normal-window -steal-focus \
    -pid /tmp/rofi-fvwm-cde.pid \
    -show drun -show-icons -icon-theme 'Flat-Remix-Green-Light' \
    -theme /home/yang/git/fvwm/rofi/cde.rasi
+ I Schedule 80  Next (rofi) Focus
+ I Schedule 200 Next (rofi) Focus

Key Space A $[modkey] Function LaunchRofi

# -----------------------------------------------------------------------------
# Alt + Tab → rofi 窗口切换；取消 F1/Help 根菜单
# -----------------------------------------------------------------------------
DestroyFunc LaunchRofiWindow
AddToFunc LaunchRofiWindow
+ I Exec exec rofi -normal-window -steal-focus \
    -pid /tmp/rofi-fvwm-window.pid \
    -show window -show-icons -icon-theme 'Flat-Remix-Green-Light' \
    -window-format '{c}  {t}' \
    -theme /home/yang/git/fvwm/rofi/cde.rasi
+ I Schedule 80  Next (rofi) Focus
+ I Schedule 200 Next (rofi) Focus

Key Tab A M Function LaunchRofiWindow
Key F1 A A Nop
Key Help A A Nop

# -----------------------------------------------------------------------------
# modkey + m → 最大化 / 恢复
# -----------------------------------------------------------------------------
Key m A $[modkey] Maximize

# -----------------------------------------------------------------------------
# 窗口操作（菜单文案见 62-menu-windowops.conf）
# -----------------------------------------------------------------------------
Key i A $[modkey] Iconify
Key q A $[modkey] Close
Key m A $[modkey]S Move
Key s A $[modkey]S Resize

# -----------------------------------------------------------------------------
# modkey + Shift + q / r → 退出 / 重载配置
# -----------------------------------------------------------------------------
Key q A $[modkey]S Quit
Key r A $[modkey]S Restart
