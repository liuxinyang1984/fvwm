# Minimal session setup for testing

DesktopName 0 Main

Style * MinWindowSize 32 32

DestroyFunc InitFunction
AddToFunc InitFunction
+ I Exec xsetroot -solid "#9aab9a"
+ I Exec xterm -geometry 80x24+80+80 -title "CDE fvwm test"

DestroyFunc RestartFunction
AddToFunc RestartFunction
+ I Nop

DestroyFunc QuitFunction
AddToFunc QuitFunction
+ I Quit
